services:

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail
      POSTGRES_DB: trailexplorer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail -d trailexplorer"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trail:trail@db:5432/trailexplorer
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

  # nginx:  # opzionale — abilitare in produzione
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf
  #     - certbot_certs:/etc/letsencrypt
  #   depends_on:
  #     - api
  #     - frontend

  etl:
    build: ./etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-trailexplorer}
      - DB_USER=${POSTGRES_USER:-trailexplorer}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-trailexplorer}
      - ETL_REGION=${ETL_REGION:-piemonte}
      - ETL_DATA_DIR=/data
    volumes:
      - etl_data:/data
    profiles:
      - etl
    restart: "no"

volumes:
  postgres_data:
  etl_data:
  # certbot_certs:
